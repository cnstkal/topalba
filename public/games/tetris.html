<meta name="claude:viewport-fit-sides" content="cover">
<title>테트리스</title>
<style>
/* 레이아웃: 가운데 정렬된 하나의 게임 화면, 아래쪽에 터치 버튼 */
:root{--bg:#f4f1ea;--panel:#e8e3d6;--fg:#1d1b18;--mute:#6f6a5e;--accent:#d9542b;--line:#cfc7b4;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16161a;--panel:#22222a;--fg:#f2eee6;--mute:#9a958a;--accent:#ff7a4d;--line:#34343e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161a;--panel:#22222a;--fg:#f2eee6;--mute:#9a958a;--accent:#ff7a4d;--line:#34343e;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box;overflow:hidden}
h1{margin:0;font-size:22px;letter-spacing:.02em;text-wrap:balance}
.top{display:flex;gap:10px;width:100%;max-width:360px;justify-content:space-between;align-items:stretch}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat small{display:block;color:var(--mute);font-size:11px;letter-spacing:.06em}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.stage{display:flex;gap:10px;align-items:flex-start;justify-content:center;width:100%;max-width:360px}
.board-wrap{position:relative;flex:none}
canvas{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 78%,transparent);border-radius:10px}
.overlay[hidden]{display:none!important}
.overlay p{margin:0;font-weight:600}
.next{width:84px;flex:none;display:flex;flex-direction:column;gap:6px}
.next canvas{width:84px;height:84px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:360px;margin-top:auto}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 0;min-height:52px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.96);background:var(--line)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.row2{display:flex;gap:8px;width:100%;max-width:360px}
.row2 button{flex:1}
@media (prefers-reduced-motion: reduce){button{transition:none}}
</style>
<main style="display:contents">
  <h1>테트리스</h1>
  <div class="top">
    <div class="stat"><small>점수</small><b id="score">0</b></div>
    <div class="stat"><small>라인</small><b id="lines">0</b></div>
    <div class="stat"><small>레벨</small><b id="level">1</b></div>
  </div>
  <div class="stage">
    <div class="board-wrap">
      <canvas id="board" width="200" height="400" aria-label="게임 보드"></canvas>
      <div class="overlay" id="menu">
        <p id="msg">시작 버튼을 눌러 주세요</p>
        <button class="primary" id="start" style="padding:12px 28px;min-height:0">시작</button>
      </div>
    </div>
    <div class="next"><small style="color:var(--mute);font-size:11px">다음</small><canvas id="nextc" width="84" height="84"></canvas></div>
  </div>
  <div class="controls">
    <button id="left" aria-label="왼쪽">◀</button>
    <button id="rot" aria-label="회전">⟳</button>
    <button id="down" aria-label="내리기">▼</button>
    <button id="right" aria-label="오른쪽">▶</button>
  </div>
  <div class="row2">
    <button id="drop">바로 내리기</button>
    <button id="pause">일시정지</button>
  </div>
</main>
<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 20;
  const COLORS = { I: '#2ec4d6', O: '#f2c94c', T: '#a66cff', S: '#5bd17a', Z: '#ff5d6c', J: '#4d7cff', L: '#ff9f43' };
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]], O: [[1,0],[2,0],[1,1],[2,1]], T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]], Z: [[0,0],[1,0],[1,1],[2,1]], J: [[0,0],[0,1],[1,1],[2,1]], L: [[2,0],[0,1],[1,1],[2,1]],
  };
  const KEYS = Object.keys(SHAPES);
  const $ = (id) => document.getElementById(id);
  const bc = $('board').getContext('2d'), nc = $('nextc').getContext('2d');
  const scoreEl = $('score'), linesEl = $('lines'), levelEl = $('level');
  let grid, cur, next, score, lines, level, timer, running, paused, over;

  const emptyGrid = () => Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const bag = [];
  const draw7 = () => { if (!bag.length) bag.push(...KEYS.slice().sort(() => Math.random() - 0.5)); return bag.pop(); };
  const spawn = (type) => ({ type, rot: 0, x: 3, y: 0 });
  const cells = (p, rot = p.rot) => {
    let c = SHAPES[p.type].map(([x, y]) => [x, y]);
    for (let r = 0; r < rot % 4; r++) c = c.map(([x, y]) => [3 - y, x]); // 90도 회전
    const minX = Math.min(...c.map(([x]) => x)), maxX = Math.max(...c.map(([x]) => x));
    const minY = Math.min(...c.map(([, y]) => y)), maxY = Math.max(...c.map(([, y]) => y));
    return c.map(([x, y]) => [x - Math.floor((minX + maxX) / 2) + 1, y - minY]).map(([x, y]) => [x, y]);
  };
  const fits = (p, dx = 0, dy = 0, rot = p.rot) => cells(p, rot).every(([x, y]) => {
    const nx = p.x + x + dx, ny = p.y + y + dy;
    return nx >= 0 && nx < COLS && ny < ROWS && (ny < 0 || !grid[ny][nx]);
  });

  const drawBlock = (ctx, x, y, size, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x * size + 1, y * size + 1, size - 2, 3);
  };
  const render = () => {
    bc.clearRect(0, 0, 200, 400);
    grid.forEach((row, y) => row.forEach((c, x) => c && drawBlock(bc, x, y, CELL, c)));
    if (cur) cells(cur).forEach(([x, y]) => { const px = cur.x + x, py = cur.y + y; if (py >= 0) drawBlock(bc, px, py, CELL, COLORS[cur.type]); });
    nc.clearRect(0, 0, 84, 84);
    if (next) cells(spawn(next), 0).forEach(([x, y]) => drawBlock(nc, x + 0.5, y + 1, 18, COLORS[next]));
  };
  const updateStats = () => { scoreEl.textContent = score; linesEl.textContent = lines; levelEl.textContent = level; };
  const speed = () => Math.max(110, 800 - (level - 1) * 70);

  const lock = () => {
    cur.at = cells(cur).forEach(([x, y]) => { const py = cur.y + y, px = cur.x + x; if (py >= 0) grid[py][px] = COLORS[cur.type]; });
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(Boolean)) { grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); cleared++; y++; }
    }
    if (cleared) {
      lines += cleared;
      score += [0, 100, 300, 500, 800][cleared] * level;
      level = Math.floor(lines / 10) + 1;
      updateStats();
    }
    cur = spawn(next);
    next = draw7();
    if (!fits(cur)) return endGame();
    render();
  };
  const step = () => {
    if (!running || paused) return;
    if (fits(cur, 0, 1)) cur.y++; else lock();
    render();
  };
  const restartTimer = () => { clearInterval(timer); timer = setInterval(step, speed()); };
  const endGame = () => {
    running = false; over = true; clearInterval(timer);
    $('msg').textContent = `게임 종료 · 점수 ${score}`;
    $('start').textContent = '다시 시작';
    $('menu').hidden = false;
  };
  const start = () => {
    grid = emptyGrid(); bag.length = 0; score = 0; lines = 0; level = 1; over = false; paused = false; running = true;
    next = draw7(); cur = spawn(draw7()); updateStats(); $('menu').hidden = true; $('pause').textContent = '일시정지';
    render(); restartTimer();
  };
  const move = (dx) => { if (!running || paused) return; if (fits(cur, dx, 0)) cur.x += dx; render(); };
  const rotate = () => {
    if (!running || paused) return;
    const r = (cur.rot + 1) % 4;
    for (const kick of [0, -1, 1, -2, 2]) if (fits(cur, kick, 0, r)) { cur.rot = r; cur.x += kick; break; }
    render();
  };
  const softDrop = () => { if (!running || paused) return; if (fits(cur, 0, 1)) { cur.y++; score += 1; updateStats(); } else lock(); render(); };
  const hardDrop = () => {
    if (!running || paused) return;
    let d = 0; while (fits(cur, 0, d + 1)) d++;
    cur.y += d; score += d * 2; updateStats(); lock(); render();
  };
  const togglePause = () => {
    if (!running) return;
    paused = !paused; $('pause').textContent = paused ? '계속하기' : '일시정지';
    if (paused) { $('msg').textContent = '일시정지'; $('menu').hidden = false; $('start').textContent = '계속하기'; }
    else $('menu').hidden = true;
  };

  $('start').onclick = () => { if (paused) togglePause(); else start(); };
  $('left').onclick = () => move(-1);
  $('right').onclick = () => move(1);
  $('rot').onclick = rotate;
  $('down').onclick = softDrop;
  $('drop').onclick = hardDrop;
  $('pause').onclick = togglePause;
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft') move(-1);
    else if (k === 'ArrowRight') move(1);
    else if (k === 'ArrowUp' || k === 'x' || k === 'X') rotate();
    else if (k === 'ArrowDown') softDrop();
    else if (k === ' ') { e.preventDefault(); hardDrop(); }
    else if (k === 'p' || k === 'P') togglePause();
  });

  grid = emptyGrid(); render(); updateStats();
})();
</script>
